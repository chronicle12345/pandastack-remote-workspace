<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PandaStack 远程桌面</title>
<style>
  :root { color-scheme: dark; --bar:#171b22; --line:#303845; --text:#edf2f7; --muted:#aab4c2; --accent:#4ea1ff; --danger:#ff7b72; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#0b0e13; color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }
  header { flex:0 0 56px; display:flex; align-items:center; gap:10px; padding:0 14px; background:var(--bar); border-bottom:1px solid var(--line); }
  .brand { font-weight:650; white-space:nowrap; margin-right:8px; }
  #connection-status { color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .actions { display:flex; gap:8px; flex-wrap:nowrap; }
  button { border:1px solid var(--line); border-radius:7px; background:#222936; color:var(--text); padding:8px 12px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:#4b5a70; background:#2a3342; }
  button:disabled { opacity:.55; cursor:wait; }
  button.primary { border-color:#2d6db3; background:#1d4f86; }
  button.danger { color:var(--danger); }
  main { position:relative; flex:1 1 auto; min-height:0; }
  iframe { display:block; width:100%; height:100%; border:0; background:#000; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#202734; border:1px solid var(--line); border-radius:8px; padding:9px 14px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; }
  #toast.show { opacity:1; }
  @media (max-width:760px) {
    header { flex-wrap:wrap; height:auto; padding:8px 10px; }
    .brand { display:none; }
    #connection-status { flex-basis:100%; order:2; font-size:12px; }
    .actions { order:1; width:100%; overflow-x:auto; }
    button { padding:7px 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">PandaStack 远程桌面</div>
  <div id="connection-status">正在载入远程桌面</div>
  <div class="actions">
    <button id="reconnect" class="primary" type="button">重连</button>
    <button data-action="terminal" type="button">终端</button>
    <button data-action="browser" type="button">浏览器</button>
    <button data-action="windows" type="button">窗口</button>
    <button id="logout" class="danger" type="button">退出登录</button>
  </div>
</header>
<main>
  <iframe id="desktop-frame" title="远程桌面" src="/vnc.html?autoconnect=1&amp;resize=scale&amp;reconnect=1&amp;reconnect_delay=1000&amp;show_dot=1"></iframe>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/desktop.js"></script>
</body>
</html>
